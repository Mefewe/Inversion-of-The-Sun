l_russian:
 LOADING_TIP_0: "Жирафы — бессердечные создания."
 LOADING_TIP_1: "Вы (радио Кристалии) нанимаете шлюх специально, чтобы меня (Блекина) дискредетировать. \n — Блекин «Полковник» Љонен, после репортажа Радио Кристалии о военных преступлениях гвардии КИ."
 LOADING_TIP_2: "Помни, сарбоз! В бою твоя подготовка окажется не у уровня твоих ожиданий, а около уровня твоей подготовки! \n — Надпись на казармах в Теғрейне"
 LOADING_TIP_3: "Прощает только Бог, а я могу лишь помиловать. \n — Гмаппе Астрайп"
 LOADING_TIP_4: "С одним лишь получением оружия вам не становится подвластна смерть. Никто вам не выдаст патроны если их нет, а у нас их нету! Пиздец! \n — Вакай Местальц"
 LOADING_TIP_5: "Чем больше окружающие знают, что вы собой представляете и что от вас следует ожидать, тем сильнее это ограничивает вашу свободу. \n — Неизвестный"
 LOADING_TIP_6: "Вопрос политического развития нашего общества является гораздо более нормативным, чем может показаться. Если спросить 10 пони на одну тему, то окажется, что в среднем число PI равно 10, а президентов у нас одновременно правит штук 20. Не всё должно решать урна голосования. \n — Пэйпер Шелф"
 LOADING_TIP_7: "Я видал ядерные взрывы! \n — Зарка Иконси"
 LOADING_TIP_8: "Чейнджлингофобия? Не убоюсь я хитиновых обрубков! \n — Боец одного из отрядов «Анвильских Рейнджеров»"
 LOADING_TIP_9: "Разъйобали нам дороғи все! Все, провиант весь кончиўся! Мы сидим бля, выйхать не моджем, там шахраї ходють запиздиють, танки аж уғнали! Ну зато хоть не в империи мушукскои жявем! \n — Случайный житель сельской местности Тирлитии"
 LOADING_TIP_10: "Население данной части Империи является крайним парадоксом — оно говорит про магию дружбы, но при этом после улыбки в лицо стреляет нашим солдатам в затылок. Силы колонистов должны быть заселены ВСЕГДА отдельно от нативного населения копытных. Допускается даже размещение в землянках и барраках. Пони слишком лицемерны, чтобы жить с ними на расстоянии минометно-артиллерийского залпа. \n — Официальное пособие по развитию нефтедобычи ВЧИ на Новых Территориях, 1769"
 LOADING_TIP_11: "Я не вижу прошлого, а только лишь будущее. И оно красного цвета. \n — Неизвестный"
 LOADING_TIP_12: "Нация! Развитие! Триумф! \n — Кризалис"
 LOADING_TIP_13: "ВОСХИЩАЙСЯ МНОЙ, ВОСХИЩАЙСЯ ДОМОМ МОИМ! ВОСХИЩАЙСЯ МОИМИ ДЕТЬМИ — ОНИ МОЯ НАЦИЯ! \n — Кризалис"
 LOADING_TIP_14: "Зебры с деревни — это то самое, против чего, собственно говоря, Кризалис и воевала. Это биомусор. У них черепа неправильные! Посмотри, какой скошенный лоб! Тут мог быть мозг, но у этого партизанера пустота! Мы будем сражаться за цивилизацию и город до самой смерти! \n — KAF.GetLeader"
 LOADING_TIP_15: "Нация силовиков может построить лишь тюрьму. \n — Арлемань Криаль, объявляя демобилизацию"
 LOADING_TIP_16: "Азив — это не страна, а метод мышления, который оказался прав. Нация, которая дала возможность творить только трети своих граждан, ожидаемо проиграла нации, где работали на заводах все. \n — Сшель Игноў"
 LOADING_TIP_17: "Восприятие — это всё. Изменится оно — изменится сам мир. \n — Сшель Игноў"
 LOADING_TIP_18: "Какой дурак будет заниматься вопросами экологии в отношении тех, кто готов щебёнку жрать, лишь бы убить нашего солдата? \n — Эрих Кшент, к вопросу об фрекинге и его последствий в виде загрязнений"
 LOADING_TIP_19: "Грифоны, лошади, зебры, пони — все мы объеденены не твёрдым копытом или лапой, но нашей идеей по построению общества, в котором не будет кризатократии! \n — Сильва Сандстри"
 LOADING_TIP_20: "Кирин ничего не должен, пока он не нирик. Когда он нирик, то его можно убить, тем самым он отдаст все свои долги. \n — Яо Ненцэ, комиссар одного из полков АНД"
 LOADING_TIP_21: "Говорят, когда суёшь копыто в банку с кислотой, нельзя достать дна. Я не проверял, но советую вальтеристам провести эксперимент. \n — Блекин «Полковник» Љонен"
 LOADING_TIP_22: "ОЗОД ЭКВЕСТРИЯ! ОЗОД ТОШЛИБИНСК! \n — листовка партии «Объединение» в Тошлибинской Республике"
 LOADING_TIP_23: "Зачем это все нужно? Каждый выстрел в Эквестрии лишь приближает ее развал. Ташлибинцы уже флаг себе нарисовали, зебры тоже. Мы не может победить насилие насилием, лишь справидливостью и дружбой. Так сильно ли нужна единая Эквестрия, если она будет тиранией? \n — Дарк Сут, главнокомандующий милицией Эквестрии"
 LOADING_TIP_24: "Мы ведь тоже считали, что скорее убьем себя, чем будем с грифонами дружить. И тут вдруг появились летуны гораздо опаснее, и пришлось нам объединятся. Традиции тоже ведь когда-то появились, может самое время их изменить?  \n — Сильва Сандстри"
 LOADING_TIP_25: "Клянусь, что нет существа выше цилина и что он продолжает род от бога Саншри."
 LOADING_TIP_26: "Смерть — вот моя родина. До рождения я там был, и после последнего мгновения с саблей наперевес окажусь. \n — Грифф Ашт"
 LOADING_TIP_27: "Развитие техники лишь увеличило смертность во время боевых действий. Ядерная бомба отравила все вокруг, а поля после артиллерийской подготовки очень долго не зарастуют, ибо также отравлены. Может, не стоит дальше играть в рулетку, а присоединиться к нам, рассказав о своих потайных знаниях? \n — Неизветный агент §Rинтересной§! организации."
 LOADING_TIP_28: "Какая разница, убьёшь ты или убьют тебя? Войны выигрывают даже не золотодержатели, а лишь боги. \n Абориген побережья Кершеей, после рассказа о том, что делает эта длинная палка с спусковым крючком."
 LOADING_TIP_29: "— Когда ты убил того генерала из АНД ножом в спину, что он сказал? \n — «Теперь ты окончательно пропал» \n — Брайт Флаймз и Грин Флаймз-Барго."
 LOADING_TIP_30: "Не трать все патроны, оставь для себя один. \n — Нерцег Анвиль своему другу Йервингу Райфлу во время обороны Понивилля."